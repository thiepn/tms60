/* ===== Visual Overhaul v4: illuminated manuscript / modern learning lab ===== */
:root{
  --bg:#edf0e9;--surface:rgba(255,253,247,.92);--surface2:#f0eee6;--surface3:#e4e6dc;
  --text:#18231d;--muted:#66736a;--border:rgba(36,64,49,.14);
  --accent:#2b654b;--accent2:#174531;--accentSoft:#dceadf;--onAccent:#fffef8;
  --success:#2f7750;--successSoft:#e0f2e6;--warn:#9a6a20;--warnSoft:#f8ecd0;
  --danger:#a74444;--dangerSoft:#f8e1df;--info:#386887;--infoSoft:#e1edf4;--star:#a77415;
  --gold:#bd8d38;--gold2:#e0bd72;--goldSoft:#f5e8c8;
  --nav:#102c21;--nav2:#081d15;--navText:#f7f3e8;--navMuted:#b7c8bd;
  --shadow-sm:0 2px 8px rgba(17,44,32,.06);--shadow:0 16px 42px rgba(21,44,32,.10),0 2px 8px rgba(21,44,32,.06);
  --shadow-lg:0 24px 70px rgba(15,38,27,.15),0 8px 24px rgba(15,38,27,.08);
  --ring:0 0 0 1px rgba(255,255,255,.68) inset;
  --radius:22px;--fontScale:1;--content:1240px;
}
html[data-theme="dark"]{
  --bg:#07110d;--surface:rgba(16,29,23,.91);--surface2:#13251c;--surface3:#1d3127;
  --text:#eef4ef;--muted:#a8b8ad;--border:rgba(188,220,200,.14);
  --accent:#83c49a;--accent2:#b1ddbf;--accentSoft:#183b28;--onAccent:#07140d;
  --success:#8bd1a3;--successSoft:#163b25;--warn:#e3ba68;--warnSoft:#3d2f16;
  --danger:#f18f8f;--dangerSoft:#442221;--info:#98c3dd;--infoSoft:#193849;--star:#f3c96c;
  --gold:#d3ad62;--gold2:#f0d694;--goldSoft:#3c301a;
  --nav:#081b13;--nav2:#04100b;--navText:#f7f4ea;--navMuted:#a8bdb0;
  --shadow-sm:0 3px 12px rgba(0,0,0,.22);--shadow:0 18px 48px rgba(0,0,0,.34),0 2px 10px rgba(0,0,0,.25);
  --shadow-lg:0 28px 80px rgba(0,0,0,.48),0 8px 28px rgba(0,0,0,.32);
  --ring:0 0 0 1px rgba(255,255,255,.05) inset;
}
html{background:var(--bg)}
body{
  min-height:100vh;
  background:
    radial-gradient(circle at 84% 6%,color-mix(in srgb,var(--gold) 10%,transparent),transparent 31rem),
    radial-gradient(circle at 34% 92%,color-mix(in srgb,var(--accent) 10%,transparent),transparent 36rem),
    linear-gradient(145deg,var(--bg),color-mix(in srgb,var(--bg) 88%,var(--accentSoft)));
  background-attachment:fixed;
  font-feature-settings:"kern" 1,"liga" 1,"calt" 1;
  text-rendering:optimizeLegibility;
  overflow-x:hidden;
}
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.26;
  background-image:
    radial-gradient(circle at 1px 1px,color-mix(in srgb,var(--text) 14%,transparent) .65px,transparent .8px),
    linear-gradient(120deg,transparent 0 49.8%,color-mix(in srgb,var(--gold) 4%,transparent) 50%,transparent 50.2%);
  background-size:18px 18px,82px 82px;
  mask-image:linear-gradient(to bottom,rgba(0,0,0,.65),transparent 75%);
}

.app{position:relative;z-index:1}
::selection{background:color-mix(in srgb,var(--accent) 28%,transparent);color:var(--text)}
*{scrollbar-width:thin;scrollbar-color:color-mix(in srgb,var(--accent) 36%,transparent) transparent}
*::-webkit-scrollbar{width:10px;height:10px}*::-webkit-scrollbar-track{background:transparent}*::-webkit-scrollbar-thumb{background:color-mix(in srgb,var(--accent) 28%,transparent);border:3px solid transparent;background-clip:padding-box;border-radius:999px}

/* App shell */
.app{grid-template-columns:276px minmax(0,1fr)}
.sidebar{
  padding:24px 18px 20px;border-right:0;color:var(--navText);
  background:
    radial-gradient(circle at 16% 0%,rgba(212,181,112,.18),transparent 17rem),
    radial-gradient(circle at 90% 78%,rgba(71,151,105,.17),transparent 20rem),
    linear-gradient(180deg,var(--nav),var(--nav2));
  box-shadow:12px 0 36px rgba(4,21,14,.14);
  overflow:hidden;
}
.sidebar::before{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(110deg,rgba(255,255,255,.035),transparent 25%,transparent 72%,rgba(255,255,255,.02));border-right:1px solid rgba(255,255,255,.06)}
.sidebar::after{content:"";position:absolute;width:220px;height:220px;border:1px solid rgba(226,193,119,.16);border-radius:50%;left:-128px;bottom:-80px;box-shadow:0 0 0 24px rgba(226,193,119,.025),0 0 0 52px rgba(226,193,119,.018);pointer-events:none}
.sidebar>*{position:relative;z-index:1}
.brand{gap:13px;padding:2px 8px 20px;border-bottom:1px solid rgba(255,255,255,.09)}
.brand-mark{
  width:50px;height:50px;border-radius:17px;color:#fff9e8;
  background:linear-gradient(145deg,#c79a47,#846321 54%,#2a6449 55%,#173e2d);
  box-shadow:0 12px 28px rgba(0,0,0,.25),0 0 0 1px rgba(255,255,255,.16) inset,0 0 0 5px rgba(255,255,255,.035);
  text-shadow:0 1px 5px rgba(0,0,0,.25);font-size:1.08rem;position:relative;isolation:isolate;
}
.brand-mark::after{content:"✦";position:absolute;right:-4px;top:-7px;font-size:.72rem;color:var(--gold2);filter:drop-shadow(0 2px 4px rgba(0,0,0,.4))}
.brand-title{font-size:1.03rem;letter-spacing:-.015em;color:var(--navText)}
.brand-sub{color:var(--navMuted);letter-spacing:.035em;margin-top:3px}
.nav{gap:7px;margin-top:2px}
.nav-btn{position:relative;border-radius:14px;padding:11px 13px;color:var(--navMuted);font-weight:680;transition:background .2s ease,color .2s ease,transform .2s ease,box-shadow .2s ease}
.nav-btn::after{content:"";position:absolute;left:0;top:50%;width:3px;height:0;border-radius:999px;background:linear-gradient(var(--gold2),var(--gold));transform:translateY(-50%);transition:height .22s ease;box-shadow:0 0 14px rgba(224,189,114,.55)}
.nav-icon{width:30px;height:30px;display:grid;place-items:center;border-radius:10px;background:rgba(255,255,255,.045);color:currentColor;transition:background .2s ease,transform .2s ease}
.nav-icon svg{width:18px;height:18px;display:block}
.nav-btn:hover{background:rgba(255,255,255,.07);color:var(--navText);transform:translateX(2px)}
.nav-btn:hover .nav-icon{background:rgba(255,255,255,.08)}
.nav-btn.active{color:#fff;background:linear-gradient(90deg,rgba(132,197,155,.20),rgba(255,255,255,.055));box-shadow:0 8px 22px rgba(0,0,0,.12),0 0 0 1px rgba(255,255,255,.055) inset}
.nav-btn.active::after{height:25px}.nav-btn.active .nav-icon{background:linear-gradient(145deg,rgba(220,192,125,.28),rgba(126,193,151,.19));color:#fff;box-shadow:0 5px 14px rgba(0,0,0,.12)}
.sidebar-foot{padding:14px 15px;border:1px solid rgba(255,255,255,.1);border-radius:16px;background:rgba(255,255,255,.045);color:var(--navMuted);box-shadow:0 10px 24px rgba(0,0,0,.08) inset;backdrop-filter:blur(8px)}
.sidebar-foot strong{color:var(--navText)}

.main{position:relative}
.topbar{background:color-mix(in srgb,var(--bg) 73%,transparent);backdrop-filter:blur(20px) saturate(135%);border-bottom:1px solid color-mix(in srgb,var(--border) 78%,transparent);box-shadow:0 4px 24px rgba(17,44,32,.035)}
.topbar-inner{padding:15px 30px}
.top-title{font-weight:760;letter-spacing:-.02em}
.status-pill{position:relative;padding:7px 12px 7px 27px;background:color-mix(in srgb,var(--surface) 74%,transparent);border:1px solid var(--border);box-shadow:var(--shadow-sm);color:var(--muted);backdrop-filter:blur(10px)}
.status-pill::before{content:"";position:absolute;left:11px;top:50%;width:8px;height:8px;border-radius:50%;background:var(--success);transform:translateY(-50%);box-shadow:0 0 0 4px color-mix(in srgb,var(--success) 13%,transparent)}
.content{padding:34px 32px 92px}
.view.active{animation:viewRise .42s cubic-bezier(.22,.8,.24,1)}
@keyframes viewRise{from{opacity:0;transform:translateY(10px) scale(.997)}to{opacity:1;transform:none}}
.page-head{align-items:center;margin-bottom:28px}
.page-head h1{font-size:clamp(2rem,3.4vw,2.8rem);line-height:1.06;letter-spacing:-.052em;font-weight:820;position:relative;padding-left:18px}
.page-head h1::before{content:"";position:absolute;left:0;top:.13em;bottom:.12em;width:5px;border-radius:99px;background:linear-gradient(var(--gold2),var(--accent));box-shadow:0 0 20px color-mix(in srgb,var(--gold) 25%,transparent)}
.page-head p{font-size:.97rem;max-width:760px;margin-top:8px}

/* Controls */
.btn{
  border-color:color-mix(in srgb,var(--border) 86%,transparent);background:color-mix(in srgb,var(--surface) 92%,transparent);
  min-height:44px;padding:9px 15px;border-radius:13px;box-shadow:var(--shadow-sm),var(--ring);
  transition:transform .18s ease,box-shadow .18s ease,background .18s ease,border-color .18s ease,color .18s ease;
  position:relative;overflow:hidden;isolation:isolate;
}
.btn::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(110deg,transparent 25%,rgba(255,255,255,.24) 50%,transparent 75%);transform:translateX(-125%);transition:transform .55s ease}
.btn:hover:not(:disabled){background:var(--surface);border-color:color-mix(in srgb,var(--accent) 26%,var(--border));transform:translateY(-2px);box-shadow:0 10px 22px rgba(19,47,34,.10),var(--ring)}
.btn:hover:not(:disabled)::after{transform:translateX(125%)}
.btn:active:not(:disabled){transform:translateY(0) scale(.985);box-shadow:var(--shadow-sm)}
.btn.primary{background:linear-gradient(145deg,color-mix(in srgb,var(--accent) 90%,#fff),var(--accent2));border-color:color-mix(in srgb,var(--accent2) 80%,transparent);color:var(--onAccent);box-shadow:0 10px 24px color-mix(in srgb,var(--accent) 26%,transparent),0 1px 0 rgba(255,255,255,.18) inset}
.btn.primary:hover:not(:disabled){background:linear-gradient(145deg,color-mix(in srgb,var(--accent) 84%,#fff),color-mix(in srgb,var(--accent2) 88%,#000));box-shadow:0 14px 30px color-mix(in srgb,var(--accent) 32%,transparent),0 1px 0 rgba(255,255,255,.2) inset}
.btn.danger{background:color-mix(in srgb,var(--dangerSoft) 58%,var(--surface));box-shadow:none}
.icon-btn{border-radius:14px}.icon-btn>svg{width:20px;height:20px;display:block;flex:0 0 auto}

/* Cards and metrics */
.card{
  border:1px solid color-mix(in srgb,var(--border) 90%,transparent);border-radius:var(--radius);
  background:linear-gradient(145deg,color-mix(in srgb,var(--surface) 97%,#fff),var(--surface));
  box-shadow:var(--shadow),var(--ring);position:relative;
}
.card::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:linear-gradient(120deg,rgba(255,255,255,.19),transparent 24%,transparent 78%,color-mix(in srgb,var(--accent) 3%,transparent));opacity:.7}
.card>*{position:relative;z-index:1}
.card.flat{box-shadow:var(--shadow-sm),var(--ring)}
.card h2{font-size:1.13rem;letter-spacing:-.025em}.card h3{font-size:.98rem;letter-spacing:-.018em}
.grid{gap:18px}.grid.metrics{gap:14px;margin-bottom:22px}
.metric{
  min-height:126px;padding:17px 18px;border-radius:18px;border:1px solid var(--border);
  background:linear-gradient(150deg,color-mix(in srgb,var(--surface) 96%,#fff),color-mix(in srgb,var(--surface2) 45%,var(--surface)));
  box-shadow:var(--shadow-sm),var(--ring);position:relative;overflow:hidden;
  transition:transform .2s ease,box-shadow .2s ease,border-color .2s ease;
}
.metric::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:linear-gradient(90deg,var(--accent),var(--gold2),transparent 82%)}
.metric::after{content:"";position:absolute;width:88px;height:88px;border-radius:50%;right:-38px;bottom:-44px;border:1px solid color-mix(in srgb,var(--accent) 13%,transparent);box-shadow:0 0 0 14px color-mix(in srgb,var(--accent) 2.8%,transparent),0 0 0 29px color-mix(in srgb,var(--gold) 2.2%,transparent)}
.metric-label{font-size:.78rem;text-transform:uppercase;letter-spacing:.075em;font-weight:760;color:var(--muted)}
.metric-value{font-size:2rem;font-weight:840;letter-spacing:-.055em;margin-top:7px;line-height:1}
.metric-note{font-size:.77rem;line-height:1.35;margin-top:8px}
@media(hover:hover){.metric:hover{transform:translateY(-3px);box-shadow:0 16px 34px rgba(17,44,32,.10),var(--ring);border-color:color-mix(in srgb,var(--accent) 22%,var(--border))}.card.pack-card:hover,.verse-item:hover{transform:translateY(-3px);box-shadow:var(--shadow)}}
.badge{padding:5px 9px;border:1px solid color-mix(in srgb,var(--border) 72%,transparent);box-shadow:0 1px 0 rgba(255,255,255,.4) inset;letter-spacing:.012em}
.eyebrow{color:color-mix(in srgb,var(--muted) 86%,var(--gold));letter-spacing:.13em}

/* Home */
.hero{grid-template-columns:minmax(0,1.55fr) minmax(270px,.75fr);gap:20px;margin-bottom:22px}
.session-card{
  min-height:286px;padding:31px 32px;color:#f8f6ee;
  background:
    radial-gradient(circle at 84% 16%,rgba(239,213,151,.23),transparent 12rem),
    radial-gradient(circle at 96% 100%,rgba(105,188,139,.26),transparent 18rem),
    linear-gradient(135deg,#153e2d 0%,#0f3023 54%,#092219 100%);
  border-color:rgba(255,255,255,.10);box-shadow:0 24px 56px rgba(9,39,26,.22),0 1px 0 rgba(255,255,255,.12) inset;overflow:hidden;
}
.session-card::before{background:
  linear-gradient(120deg,rgba(255,255,255,.08),transparent 28%),
  repeating-radial-gradient(circle at 94% 4%,transparent 0 23px,rgba(239,213,151,.07) 24px 25px);opacity:1}
.session-card::after{width:290px;height:290px;right:-120px;top:-122px;background:transparent;border:1px solid rgba(238,211,145,.28);box-shadow:0 0 0 28px rgba(238,211,145,.035),0 0 0 62px rgba(238,211,145,.024)}
.session-card .eyebrow{color:#e3c986}.session-card .session-title{font-size:clamp(1.75rem,3vw,2.25rem);line-height:1.08;color:#fff;max-width:720px}.session-card .muted{color:#c9d6ce}.session-card .btn.primary{background:linear-gradient(145deg,#e0bf76,#b58634);border-color:#e3c77f;color:#173023;box-shadow:0 12px 30px rgba(0,0,0,.22),0 1px 0 rgba(255,255,255,.35) inset}.session-card .btn.primary:hover{background:linear-gradient(145deg,#efd99f,#c6963f)}
.queue-chips{gap:8px;margin:18px 0 22px}.queue-chip{padding:7px 10px;border-color:rgba(255,255,255,.13);background:rgba(255,255,255,.075);color:#e6eee8;backdrop-filter:blur(7px);box-shadow:0 1px 0 rgba(255,255,255,.06) inset}
.hero-side{gap:16px}.hero-side>.card{overflow:hidden}
.hero-side>.card:first-child{background:linear-gradient(145deg,color-mix(in srgb,var(--surface) 95%,var(--goldSoft)),var(--surface))}
.verse-number{width:48px;height:48px;border-radius:16px;background:linear-gradient(145deg,var(--goldSoft),var(--accentSoft));color:var(--accent2);box-shadow:0 7px 18px color-mix(in srgb,var(--accent) 11%,transparent),0 0 0 1px rgba(255,255,255,.7) inset}
.quote-mini{font-size:1.04rem;line-height:1.58;color:color-mix(in srgb,var(--text) 88%,var(--muted));margin-top:5px}
.home-secondary{gap:20px;margin-bottom:20px}.pack-grid{gap:12px}
.pack-card{--pack-accent:var(--accent);min-height:188px;padding:17px;overflow:hidden;transition:transform .2s ease,box-shadow .2s ease,border-color .2s ease;background:linear-gradient(155deg,color-mix(in srgb,var(--surface) 96%,#fff),color-mix(in srgb,var(--pack-accent) 6%,var(--surface)))}
.pack-card:nth-child(1){--pack-accent:#2c7251}.pack-card:nth-child(2){--pack-accent:#4e6e9a}.pack-card:nth-child(3){--pack-accent:#9a6c2b}.pack-card:nth-child(4){--pack-accent:#77569a}.pack-card:nth-child(5){--pack-accent:#9a4f54}
.pack-card::after{content:"";position:absolute;width:88px;height:88px;right:-40px;top:-42px;border-radius:50%;background:color-mix(in srgb,var(--pack-accent) 10%,transparent);box-shadow:0 0 0 20px color-mix(in srgb,var(--pack-accent) 3%,transparent)}
.pack-letter{color:var(--pack-accent);font-size:.78rem;text-transform:uppercase;letter-spacing:.09em}.pack-name{font-weight:720;line-height:1.3}.pack-card .btn{margin-top:auto;background:color-mix(in srgb,var(--pack-accent) 6%,var(--surface))}
.progress-track{height:11px;background:color-mix(in srgb,var(--surface3) 88%,transparent);border:1px solid color-mix(in srgb,var(--border) 58%,transparent);box-shadow:0 1px 2px rgba(0,0,0,.05) inset}
.progress-fill{position:relative;background:linear-gradient(90deg,var(--accent),color-mix(in srgb,var(--accent) 62%,var(--gold2)));box-shadow:0 0 12px color-mix(in srgb,var(--accent) 20%,transparent);transition:width .55s cubic-bezier(.2,.8,.2,1)}
.progress-fill::after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 25%,rgba(255,255,255,.35) 50%,transparent 75%);transform:translateX(-100%);animation:progressShine 3.6s ease-in-out infinite}
@keyframes progressShine{0%,55%{transform:translateX(-110%)}85%,100%{transform:translateX(120%)}}
.week-strip{gap:9px}.day-cell{padding:12px 5px;border:1px solid transparent;background:color-mix(in srgb,var(--surface2) 78%,transparent);transition:transform .18s ease,background .18s ease}.day-cell strong{display:block;font-size:1.08rem;margin-top:3px}.day-cell.done{background:linear-gradient(145deg,var(--accentSoft),color-mix(in srgb,var(--goldSoft) 20%,var(--accentSoft)));color:var(--accent2);border-color:color-mix(in srgb,var(--accent) 16%,transparent)}.day-cell.today{box-shadow:0 0 0 2px var(--surface),0 0 0 4px color-mix(in srgb,var(--gold) 70%,var(--accent));transform:translateY(-2px)}

/* Study experience */
.study-toolbar{padding:10px 12px;border:1px solid var(--border);border-radius:16px;background:color-mix(in srgb,var(--surface) 78%,transparent);box-shadow:var(--shadow-sm);backdrop-filter:blur(14px);margin-bottom:16px}
.study-shell{grid-template-columns:minmax(0,1fr) 280px;gap:20px}
.study-card{
  min-height:570px;padding:24px 26px;
  background:
    radial-gradient(circle at 50% 0%,color-mix(in srgb,var(--goldSoft) 24%,transparent),transparent 20rem),
    linear-gradient(145deg,color-mix(in srgb,var(--surface) 98%,#fff),var(--surface));
  box-shadow:var(--shadow-lg),var(--ring);overflow:hidden;
}
.study-card::after{content:"";position:absolute;inset:13px;border:1px solid color-mix(in srgb,var(--gold) 11%,transparent);border-radius:calc(var(--radius) - 8px);pointer-events:none}
.study-meta{padding-bottom:13px;border-bottom:1px solid color-mix(in srgb,var(--border) 72%,transparent)}
.prompt{padding:35px 6px 22px}.prompt-ref{font-size:clamp(1.65rem,3.5vw,2.45rem);font-weight:840;letter-spacing:-.045em;color:var(--accent2);text-wrap:balance}.prompt-help{max-width:680px;margin:9px auto 0;font-size:.93rem}
.verse-text{font-family:Georgia,"Times New Roman",serif;font-size:clamp(1.17rem,2.5vw,1.52rem);line-height:1.82;letter-spacing:.003em;padding:6px 24px 6px 30px;position:relative;text-wrap:pretty}
.verse-text::before{content:"“";position:absolute;left:-2px;top:-18px;font-family:Georgia,serif;font-size:4.6rem;line-height:1;color:color-mix(in srgb,var(--gold) 28%,transparent);pointer-events:none}
.verse-text.center{padding-left:30px;padding-right:30px}
.study-footer{padding:17px 18px 0;margin:22px -2px 0;border-top:1px solid var(--border);background:linear-gradient(180deg,transparent,color-mix(in srgb,var(--accentSoft) 10%,transparent))}
.study-side{gap:15px;position:sticky;top:90px;align-self:start}.study-side .card{padding:17px;background:color-mix(in srgb,var(--surface) 86%,transparent);backdrop-filter:blur(10px)}
.queue-list{max-height:390px;padding-right:3px}.queue-item{padding:8px 9px;border-radius:10px;transition:background .16s ease,transform .16s ease}.queue-item.current{background:linear-gradient(90deg,var(--accentSoft),color-mix(in srgb,var(--accentSoft) 40%,transparent));box-shadow:0 0 0 1px color-mix(in srgb,var(--accent) 12%,transparent) inset}.queue-item.done{opacity:.48}.dot{box-shadow:0 0 0 3px color-mix(in srgb,currentColor 10%,transparent)}
textarea,input[type="text"],input[type="number"],input[type="date"],select{
  border-color:color-mix(in srgb,var(--border) 90%,transparent);background:color-mix(in srgb,var(--surface) 93%,transparent);border-radius:13px;padding:11px 13px;box-shadow:0 1px 0 rgba(255,255,255,.45) inset,0 2px 5px rgba(18,46,33,.035);transition:border-color .18s ease,box-shadow .18s ease,background .18s ease;
}
textarea{min-height:164px;padding:15px 16px;font-size:1.03rem;line-height:1.62;background:linear-gradient(180deg,color-mix(in srgb,var(--surface) 96%,#fff),var(--surface));background-image:repeating-linear-gradient(to bottom,transparent 0 31px,color-mix(in srgb,var(--border) 27%,transparent) 32px)}
textarea:focus,input:focus,select:focus{border-color:color-mix(in srgb,var(--accent) 56%,var(--border));box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 12%,transparent),0 8px 20px rgba(18,46,33,.06);background:var(--surface)}
.answer-actions{margin-top:12px}.rating-row{gap:10px;margin-top:17px}.rate-btn{min-height:67px;border-radius:14px;background:var(--surface);box-shadow:var(--shadow-sm);transition:transform .18s ease,box-shadow .18s ease,background .18s ease,border-color .18s ease}.rate-btn[data-rate="0"]{background:color-mix(in srgb,var(--dangerSoft) 46%,var(--surface));border-color:color-mix(in srgb,var(--danger) 20%,var(--border))}.rate-btn[data-rate="1"]{background:color-mix(in srgb,var(--warnSoft) 42%,var(--surface));border-color:color-mix(in srgb,var(--warn) 18%,var(--border))}.rate-btn[data-rate="2"]{background:color-mix(in srgb,var(--infoSoft) 35%,var(--surface));border-color:color-mix(in srgb,var(--info) 16%,var(--border))}.rate-btn[data-rate="3"]{background:color-mix(in srgb,var(--successSoft) 48%,var(--surface));border-color:color-mix(in srgb,var(--success) 21%,var(--border))}.rate-btn:hover:not(:disabled){transform:translateY(-3px);box-shadow:0 12px 25px rgba(18,46,33,.10)}
.feedback{padding:15px 17px;border-radius:15px;box-shadow:0 5px 18px rgba(17,44,32,.05) inset}.score-big{font-size:1.7rem}.diff{font-family:Georgia,"Times New Roman",serif;font-size:1.02rem;margin-top:10px}.tok-ok,.tok-wrong,.tok-missing,.tok-extra{padding:2px 1px}.tok-missing{padding:2px 5px}.initials-prompt{padding:18px 20px;border-radius:16px;background:color-mix(in srgb,var(--surface2) 70%,transparent);border:1px dashed color-mix(in srgb,var(--accent) 25%,var(--border));font-size:1.08rem;box-shadow:0 4px 18px rgba(17,44,32,.035) inset}
.cloze-line{padding:18px 20px;border-radius:18px;background:color-mix(in srgb,var(--surface2) 43%,transparent);border:1px solid var(--border);font-size:1.2rem;line-height:2.55}.cloze-input{min-width:62px;max-width:165px;padding:5px 8px;margin:2px 3px;border-radius:9px;background:var(--surface);border:1px solid color-mix(in srgb,var(--accent) 28%,var(--border));box-shadow:0 3px 10px rgba(17,44,32,.05)}.cloze-correction{font-weight:720;margin-top:3px}.phrase-list{gap:10px}.phrase{padding:13px 15px;border-radius:13px;background:linear-gradient(145deg,var(--surface2),color-mix(in srgb,var(--surface) 50%,var(--surface2)));border-color:color-mix(in srgb,var(--accent) 12%,var(--border));box-shadow:0 5px 14px rgba(17,44,32,.045);font-size:1.05rem;position:relative;padding-left:40px}.phrase::before{content:"";position:absolute;left:18px;top:50%;width:8px;height:8px;border-radius:50%;background:var(--accent);transform:translateY(-50%);box-shadow:0 0 0 5px color-mix(in srgb,var(--accent) 10%,transparent)}.phrase.hidden-phrase::before{background:var(--muted)}
.complete-mark{width:84px;height:84px;background:linear-gradient(145deg,var(--successSoft),color-mix(in srgb,var(--goldSoft) 35%,var(--successSoft)));border:1px solid color-mix(in srgb,var(--success) 22%,transparent);box-shadow:0 15px 34px color-mix(in srgb,var(--success) 14%,transparent),0 0 0 9px color-mix(in srgb,var(--success) 5%,transparent);animation:completePop .6s cubic-bezier(.2,1.3,.35,1)}
.session-complete{overflow:hidden}.session-complete::after{content:"";position:absolute;width:360px;height:360px;left:50%;top:-260px;border-radius:50%;transform:translateX(-50%);background:repeating-conic-gradient(from 0deg,color-mix(in srgb,var(--gold) 22%,transparent) 0 3deg,transparent 3deg 14deg);mask-image:radial-gradient(circle,transparent 0 34%,#000 35% 49%,transparent 50%);animation:celebrateSpin 22s linear infinite}
@keyframes completePop{from{opacity:0;transform:scale(.55) rotate(-8deg)}to{opacity:1;transform:none}}@keyframes celebrateSpin{to{transform:translateX(-50%) rotate(360deg)}}

/* Library */
.filters{padding:13px;border:1px solid var(--border);border-radius:17px;background:color-mix(in srgb,var(--surface) 78%,transparent);box-shadow:var(--shadow-sm);backdrop-filter:blur(12px);margin-bottom:17px}

/* Progress */
.progress-layout{gap:20px}.stack{gap:18px}.bar-list{gap:16px}.bar-head{font-size:.88rem;margin-bottom:7px}.forecast-grid{gap:9px}.forecast-day{padding:12px 6px;border:1px solid color-mix(in srgb,var(--border) 70%,transparent);background:linear-gradient(145deg,var(--surface2),color-mix(in srgb,var(--surface) 40%,var(--surface2)));box-shadow:var(--shadow-sm)}.forecast-count{font-size:1.45rem;letter-spacing:-.04em}.history-row{padding:11px 7px;border-radius:10px;border-bottom:0;transition:background .16s ease}.history-row:nth-child(odd){background:color-mix(in srgb,var(--surface2) 33%,transparent)}.weak-table th{font-size:.73rem;text-transform:uppercase;letter-spacing:.06em}.weak-table td{padding-top:10px;padding-bottom:10px}.weak-table tbody tr{transition:background .16s ease}.weak-table tbody tr:hover{background:color-mix(in srgb,var(--accentSoft) 28%,transparent)}

/* Settings, modal, feedback */
.settings-grid{gap:20px}.field label{letter-spacing:-.01em}.field .help{line-height:1.45}.switch-row{padding:12px 0;border-bottom:1px solid color-mix(in srgb,var(--border) 55%,transparent)}.switch-row:last-child{border-bottom:0}.switch-row input[type="checkbox"]{appearance:none;width:48px;height:27px;flex:0 0 48px;border:1px solid var(--border);border-radius:999px;background-color:var(--surface3);background-image:radial-gradient(circle at 13px 50%,#fff 0 8px,transparent 8.5px);box-shadow:0 2px 5px rgba(0,0,0,.13) inset;transition:background-color .2s ease,background-position .2s ease,border-color .2s ease}.switch-row input[type="checkbox"]:checked{background-color:var(--accent);background-image:radial-gradient(circle at calc(100% - 13px) 50%,#fff 0 8px,transparent 8.5px);border-color:var(--accent)}
input[type="range"]{accent-color:var(--accent)}
.danger-zone{background:linear-gradient(145deg,color-mix(in srgb,var(--dangerSoft) 38%,var(--surface)),var(--surface));border-color:color-mix(in srgb,var(--danger) 25%,var(--border))}

.modal-backdrop{background:rgba(3,13,8,.62);backdrop-filter:blur(9px);animation:backdropIn .18s ease}.modal{border-radius:24px;padding:24px;box-shadow:0 36px 100px rgba(0,0,0,.42),var(--ring);animation:modalIn .3s cubic-bezier(.2,.85,.25,1)}
@keyframes backdropIn{from{opacity:0}to{opacity:1}}@keyframes modalIn{from{opacity:0;transform:translateY(15px) scale(.975)}to{opacity:1;transform:none}}

/* Entrance choreography */
.view.active .metric,.view.active .hero>.card,.view.active .hero-side>.card,.view.active .home-secondary>.card,.view.active .study-shell>.study-main,.view.active .study-side>.card,.view.active .library-list>.verse-item,.view.active .progress-layout>.stack>.card,.view.active .settings-grid>.stack>.card{animation:cardEnter .42s cubic-bezier(.2,.8,.24,1) both}
.view.active .metric:nth-child(2),.view.active .hero-side>.card:nth-child(1),.view.active .study-side>.card:nth-child(1){animation-delay:.035s}.view.active .metric:nth-child(3),.view.active .hero-side>.card:nth-child(2),.view.active .study-side>.card:nth-child(2){animation-delay:.07s}.view.active .metric:nth-child(4),.view.active .study-side>.card:nth-child(3){animation-delay:.105s}

.mode-quick-toggle{min-height:34px;padding:6px 10px;border-radius:999px;background:var(--surface);color:var(--text);box-shadow:none}.mode-quick-toggle .mode-icon{font-size:1rem}.mode-quick-toggle .mode-label{font-size:.78rem}.mode-quick-toggle:hover{border-color:color-mix(in srgb,var(--accent) 45%,var(--border))}

.curriculum-note{padding:14px 16px;border:1px solid var(--line);border-radius:16px;background:var(--accent-soft);color:var(--text)}

.progress-level-note{min-height:42px;padding:10px 12px;border-radius:12px;background:var(--accent-soft);color:var(--muted);font-size:.88rem}
.inline-control-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}

<script>
/* ===== Visual enhancement layer: icons + low-cost ambient canvas ===== */
(()=>{
  const SVG={
    home:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3 10 9-7 9 7"/><path d="M5 9.5V21h14V9.5"/><path d="M9 21v-7h6v7"/></svg>',
    study:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="m10 8 6 4-6 4Z"/></svg>',
    library:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5.5A3.5 3.5 0 0 1 7.5 2H11v17H7.5A3.5 3.5 0 0 0 4 22Z"/><path d="M20 5.5A3.5 3.5 0 0 0 16.5 2H13v17h3.5A3.5 3.5 0 0 1 20 22Z"/></svg>',
    progress:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20V10"/><path d="M10 20V4"/><path d="M16 20v-7"/><path d="M22 20H2"/></svg>',
    settings:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h10"/><path d="M18 6h2"/><circle cx="16" cy="6" r="2"/><path d="M4 12h2"/><path d="M10 12h10"/><circle cx="8" cy="12" r="2"/><path d="M4 18h8"/><path d="M16 18h4"/><circle cx="14" cy="18" r="2"/></svg>',
    menu:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>'
  };
  const applyIcons=()=>{
    document.querySelectorAll('[data-view]').forEach(btn=>{const key=btn.dataset.view,slot=btn.querySelector('.nav-icon');if(slot&&SVG[key])slot.innerHTML=SVG[key]});
    const menu=document.getElementById('mobile-menu');if(menu)menu.innerHTML=SVG.menu;
  };
  applyIcons();

  const canvas=document.getElementById('ambient-canvas');
  if(!canvas)return;
  const ctx=canvas.getContext('2d',{alpha:true});
  if(!ctx)return;
  const reduceQuery=matchMedia('(prefers-reduced-motion: reduce)'),mobileQuery=matchMedia('(max-width:760px)'),motionAllowed=()=>!reduceQuery.matches&&!mobileQuery.matches;
  let w=0,h=0,dpr=1,raf=0,particles=[];
  const palette=()=>{
    const accent=document.documentElement.dataset.accent||'green';
    const palettes={
      neutral:{dot:'160,167,177',line:'112,119,130'},blue:{dot:'91,162,228',line:'102,194,219'},
      green:{dot:'87,177,124',line:'211,173,98'},red:{dot:'220,86,101',line:'215,162,88'},
      purple:{dot:'168,112,222',line:'216,142,211'},brown:{dot:'194,137,88',line:'211,177,105'},
      orange:{dot:'231,120,42',line:'228,178,82'},magenta:{dot:'218,79,151',line:'213,137,188'}

  };
  const seedParticles=()=>{

    canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr);canvas.style.width=w+'px';canvas.style.height=h+'px';ctx.setTransform(dpr,0,0,dpr,0,0);seedParticles();draw(0,true);
  };
  const draw=(time=0,once=false)=>{
    ctx.clearRect(0,0,w,h);const c=palette();

  syncMotion();

  new MutationObserver(()=>draw(performance.now(),true)).observe(document.documentElement,{attributes:true,attributeFilter:['data-mode','data-accent']});
})();
