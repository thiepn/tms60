<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="TMS 60 ESV Memory Lab favicon">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b241a"/>
      <stop offset="100%" stop-color="#174f39"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff9ea"/>
      <stop offset="100%" stop-color="#efe1b2"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#05110c" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#bg)"/>
  <rect x="13" y="10" width="30" height="40" rx="6" fill="url(#card)" stroke="#d6b35d" stroke-width="1.5" filter="url(#shadow)"/>

  <!-- top lines -->
  <rect x="18" y="16" width="20" height="2.4" rx="1.2" fill="#c7b172" opacity="0.9"/>
  <rect x="18" y="20.8" width="17" height="2.2" rx="1.1" fill="#d9c38b" opacity="0.95"/>
  <rect x="18" y="25.2" width="18" height="2.2" rx="1.1" fill="#d9c38b" opacity="0.95"/>

  <!-- cross / anchor symbol -->
  <rect x="27.4" y="29.5" width="3.2" height="10.6" rx="1.4" fill="#174f39"/>
  <rect x="23.5" y="33.1" width="11" height="3.2" rx="1.5" fill="#174f39"/>

  <!-- right badge -->
  <circle cx="46.5" cy="45.5" r="10.5" fill="#d7a84b" stroke="#fff5d8" stroke-width="1.4" filter="url(#shadow)"/>
  <text x="46.5" y="49" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10.8" font-weight="700" fill="#103527">60</text>

  <!-- subtle highlight -->
  <path d="M12 10 C20 4, 40 4, 52 12" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="2.2" stroke-linecap="round"/>
</svg>
