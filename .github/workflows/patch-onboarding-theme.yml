name: Patch onboarding and default theme

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/patch-onboarding-theme.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply onboarding and default theme changes
        shell: python
        run: |
          from pathlib import Path

          path = Path('index.html')
          source = path.read_text(encoding='utf-8')

          def rep(old, new, label):
              global source
              if old not in source:
                  raise SystemExit(f'missing patch target: {label}')
              source = source.replace(old, new, 1)

          rep('<html data-accent="green" data-mode="light" data-view="home" lang="en">', '<html data-accent="neutral" data-mode="dark" data-view="home" lang="en">', 'root theme')
          rep('<meta content="#276749" name="theme-color"/>', '<meta content="#070809" name="theme-color"/>', 'theme color')
          rep("const ACCENT_LABELS={neutral:'Neutral',blue:'Blue'", "const ACCENT_LABELS={neutral:'Black / White',blue:'Blue'", 'neutral label')
          rep("default:return{appearance:'light',accent:'green'}}}", "default:return{appearance:'dark',accent:'neutral'}}}", 'fallback theme')
          rep("settings:{appearance:'light',accent:'green',fontScale:1", "settings:{appearance:'dark',accent:'neutral',fontScale:1", 'default state theme')
          rep("const appearance=APPEARANCES.includes(state.settings.appearance)?state.settings.appearance:'light',accent=ACCENTS.includes(state.settings.accent)?state.settings.accent:'green';", "const appearance=APPEARANCES.includes(state.settings.appearance)?state.settings.appearance:'dark',accent=ACCENTS.includes(state.settings.accent)?state.settings.accent:'neutral';", 'applyTheme fallback')
          rep("if(meta)meta.content=ACCENT_META[accent]?.[appearance]||ACCENT_META.green[appearance];", "if(meta)meta.content=ACCENT_META[accent]?.[appearance]||ACCENT_META.neutral[appearance];", 'theme meta fallback')

          css = '''

/* First-run onboarding */
.onboarding-shell{display:grid;gap:20px;text-align:left}
.onboarding-brand{display:flex;align-items:center;gap:13px;padding-bottom:16px;border-bottom:1px solid var(--border)}
.onboarding-mark{width:52px;height:52px;border-radius:17px;display:grid;place-items:center;background:linear-gradient(145deg,var(--gold2),var(--gold) 54%,var(--accent) 55%,var(--accent2));color:var(--onAccent);font-weight:850;box-shadow:var(--shadow-sm)}
.onboarding-shell h2{margin:0;font-size:1.65rem;letter-spacing:-.035em}
.onboarding-shell p{margin:6px 0 0;color:var(--muted)}
.onboarding-section{display:grid;gap:9px}
.onboarding-section-title{font-weight:780}
.onboarding-version-preview{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 14px;align-items:center;padding:14px 15px;border:1px solid var(--border);border-radius:15px;background:var(--surface2)}
.onboarding-version-preview .tiny{grid-column:1/-1}
.onboarding-modal{width:min(690px,100%)}
@media(max-width:520px){.onboarding-version-preview{grid-template-columns:1fr}.onboarding-version-preview .tiny{grid-column:auto}}
'''
          rep('</style>\n</head>', css + '\n</style>\n</head>', 'onboarding css')

          fn = '''
let onboardingDismissed=false;
function onboardingSeen(){try{return localStorage.getItem(KEY+'-onboarding-v1')==='1'}catch(e){return onboardingDismissed}}
function markOnboardingSeen(){onboardingDismissed=true;try{localStorage.setItem(KEY+'-onboarding-v1','1')}catch(e){}}
function clearOnboardingSeen(){onboardingDismissed=false;try{localStorage.removeItem(KEY+'-onboarding-v1')}catch(e){}}
function onboardingModal(){
  modal(`<div class="onboarding-shell"><div class="onboarding-brand"><div class="onboarding-mark">60</div><div><div class="eyebrow">First setup</div><strong>TMS Memory Lab</strong></div></div><div><h2>Choose your look</h2><p>Black / White is the default. Pick any appearance you prefer; it can always be changed later in Settings.</p></div><div class="onboarding-section"><div class="onboarding-section-title">Light / dark</div><div class="mode-segment" role="group" aria-label="Choose light or dark mode"><button type="button" class="mode-choice ${state.settings.appearance==='light'?'active':''}" data-action="onboarding-appearance" data-value="light" aria-pressed="${state.settings.appearance==='light'}"><span aria-hidden="true">☀</span><span>Light</span></button><button type="button" class="mode-choice ${state.settings.appearance==='dark'?'active':''}" data-action="onboarding-appearance" data-value="dark" aria-pressed="${state.settings.appearance==='dark'}"><span aria-hidden="true">☾</span><span>Dark</span></button></div></div><div class="onboarding-section"><div class="onboarding-section-title">Accent</div><div class="accent-grid" role="group" aria-label="Choose accent color">${ACCENTS.map(a=>`<button type="button" class="accent-choice ${state.settings.accent===a?'active':''}" data-action="onboarding-accent" data-value="${a}" aria-pressed="${state.settings.accent===a}" title="${ACCENT_LABELS[a]}"><span class="accent-swatch accent-${a}" aria-hidden="true"></span><span>${ACCENT_LABELS[a]}</span></button>`).join('')}</div></div><div class="onboarding-version-preview"><div><div class="tiny muted">Bible version</div><strong>English Standard Version (ESV)</strong></div><span class="badge">Current</span><div class="tiny muted">Version selection will become a second onboarding choice after the additional 60-verse datasets are verified and added.</div></div><div class="modal-actions"><button class="btn primary" data-action="finish-onboarding">Start memorizing</button></div></div>`);
  document.querySelector('.modal')?.classList.add('onboarding-modal')
}
'''
          rep('function renderHome(){', fn + '\nfunction renderHome(){', 'onboarding function')

          marker = "document.addEventListener('click',e=>{const b=e.target.closest('button,[data-action]');if(!b)return;if(b.dataset.view){switchView(b.dataset.view);return}const a=b.dataset.action;if(!a)return;\n"
          actions = marker + "  if(a==='onboarding-appearance'){const value=b.dataset.value;if(!APPEARANCES.includes(value))return;state.settings.appearance=value;markSettingsChanged();applyTheme();scheduleSave(true);onboardingModal();return}\n  if(a==='onboarding-accent'){const value=b.dataset.value;if(!ACCENTS.includes(value))return;state.settings.accent=value;markSettingsChanged();applyTheme();scheduleSave(true);onboardingModal();return}\n  if(a==='finish-onboarding'){markOnboardingSeen();closeModal(false);renderAll();return}\n"
          rep(marker, actions, 'onboarding actions')

          reset_old = "if(a==='reset-all'){const snapshotAt=createRecoverySnapshot();storageWriteBlocked=false;storageBlockMessage='';state=defaultState(now());libraryFilters={search:'',pack:'all',status:'all'};libraryOpen.clear();pendingImport=null;if(snapshotAt)state.meta.lastSnapshot=snapshotAt;closeModal();scheduleSave(true);renderAll();toast('Application reset to defaults.');return}"
          reset_new = "if(a==='reset-all'){const snapshotAt=createRecoverySnapshot();storageWriteBlocked=false;storageBlockMessage='';state=defaultState(now());libraryFilters={search:'',pack:'all',status:'all'};libraryOpen.clear();pendingImport=null;if(snapshotAt)state.meta.lastSnapshot=snapshotAt;clearOnboardingSeen();closeModal(false);scheduleSave(true);renderAll();setTimeout(onboardingModal,0);toast('Application reset to defaults.');return}"
          rep(reset_old, reset_new, 'reset onboarding')

          startup = "load();renderAll();syncSidebarAccessibility();updateSaveStatus(storageWriteBlocked?(storageBlockMessage||'Read-only: stored data preserved'):storageAvailable?'Saved locally':'Session-only: browser storage unavailable');"
          rep(startup, startup + "if(!onboardingSeen())setTimeout(onboardingModal,0);", 'startup onboarding')

          for check in [
              'data-accent="neutral" data-mode="dark"',
              "neutral:'Black / White'",
              "appearance:'dark',accent:'neutral'",
              'function onboardingModal()',
              "a==='finish-onboarding'",
              "if(!onboardingSeen())setTimeout(onboardingModal,0)"
          ]:
              if check not in source:
                  raise SystemExit(f'verification failed: {check}')

          path.write_text(source, encoding='utf-8')

      - name: Syntax-check embedded JavaScript
        shell: python
        run: |
          from pathlib import Path
          import re, subprocess
          html = Path('index.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script>(.*?)</script>', html, flags=re.S)
          if not scripts:
              raise SystemExit('No embedded scripts found')
          for i, script in enumerate(scripts):
              p = Path(f'/tmp/tms60-{i}.js')
              p.write_text(script, encoding='utf-8')
              subprocess.run(['node','--check',str(p)], check=True)

      - name: Commit app update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Add first-run theme onboarding and black default"
          git push
