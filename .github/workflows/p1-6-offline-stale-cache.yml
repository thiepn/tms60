name: P1-6 Offline Stale Cache
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'app.html'
      - 'translations.js'
      - 'niv-service.json'
      - 'enhancements.js'
      - 'sw.js'
      - 'tests/p1-6-offline-stale-cache.mjs'
      - 'tests/wait-for-pages-deployment.mjs'
      - '.github/workflows/p1-6-offline-stale-cache.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  stale-cache-offline:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Wait for exact GitHub Pages deployment
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node tests/wait-for-pages-deployment.mjs
      - run: node tests/p1-6-offline-stale-cache.mjs
