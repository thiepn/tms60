name: Live PWA Installability Root Diagnostic

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'tests/live-pwa-root-diagnostic.mjs'
      - '.github/workflows/live-pwa-root-diagnostic.yml'

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - run: node tests/live-pwa-root-diagnostic.mjs
