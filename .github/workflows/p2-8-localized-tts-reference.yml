name: P2-8 Localized TTS Reference
on:
  push:
    branches: [main]
    paths:
      - 'app.html'
      - 'translations.js'
      - 'p2-5-source-prep.js'
      - 'runtime-translation-switch.js'
      - 'language-switch-hardening.js'
      - 'p2-8-localized-tts-reference.js'
      - 'sw.js'
      - 'tests/p2-8-localized-tts-reference.mjs'
      - 'tests/wait-for-pages-deployment.mjs'
      - '.github/workflows/p2-8-localized-tts-reference.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  localized-tts-reference:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Wait for exact GitHub Pages deployment
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node tests/wait-for-pages-deployment.mjs
      - run: node tests/p2-8-localized-tts-reference.mjs
