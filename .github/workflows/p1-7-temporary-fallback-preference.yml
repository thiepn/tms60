name: P1-7 Temporary Fallback Preference
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'app.html'
      - 'translations.js'
      - 'niv-service.json'
      - 'sw.js'
      - 'tests/p1-7-temporary-fallback-preference.mjs'
      - 'tests/wait-for-pages-deployment.mjs'
      - '.github/workflows/p1-7-temporary-fallback-preference.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  temporary-fallback-preference:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Wait for exact GitHub Pages deployment
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node tests/wait-for-pages-deployment.mjs
      - run: node tests/p1-7-temporary-fallback-preference.mjs
