name: P1-5 Translation TTS
# P1-5 release gate: run against the exact deployed commit.
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'app.html'
      - 'translations.js'
      - 'enhancements.js'
      - 'enhancements-core.js'
      - 'language-switch-hardening.js'
      - 'sw.js'
      - 'tests/p1-5-translation-tts.mjs'
      - 'tests/wait-for-pages-deployment.mjs'
      - '.github/workflows/p1-5-translation-tts.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  translation-tts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Wait for exact GitHub Pages deployment
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node tests/wait-for-pages-deployment.mjs
      - run: node tests/p1-5-translation-tts.mjs
