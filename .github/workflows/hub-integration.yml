name: TMS60 Hub owner qualification
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  owner-sql:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-save --no-audit --no-fund @electric-sql/pglite@0.5.8
      - run: node tests/hub/projection.test.mjs && node tests/hub/entry.test.cjs
