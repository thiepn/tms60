name: Patch punctuation scoring

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/patch-punctuation-scoring.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make punctuation non-scoring
        shell: python
        run: |
          from pathlib import Path

          path = Path("index.html")
          source = path.read_text(encoding="utf-8")

          marker = "function compareText(target,input){"
          if marker not in source:
              raise SystemExit("compareText function not found")

          helper = "function punctuationNeutralText(s){return cleanText(s).replace(/\\p{P}+/gu,' ').replace(/\\s+/g,' ').trim()}\n"
          if "function punctuationNeutralText(s)" not in source:
              source = source.replace(marker, helper + marker, 1)

          old_core = ",ct=cleanText(safeTarget),ci=cleanText(safeInput),exact=ct===ci,charScore="
          new_core = ",ct=cleanText(safeTarget),ci=cleanText(safeInput),characterExact=ct===ci,punctuationEquivalent=wordScore===100&&punctuationNeutralText(ct)===punctuationNeutralText(ci),exact=characterExact||punctuationEquivalent,charScore="
          if old_core not in source:
              raise SystemExit("compareText scoring core not found")
          source = source.replace(old_core, new_core, 1)

          old_return = ",exact,targetText:ct,inputText:ci,ops,wrong:"
          new_return = ",exact,characterExact,punctuationEquivalent,targetText:ct,inputText:ci,ops,wrong:"
          if old_return not in source:
              raise SystemExit("compareText return shape not found")
          source = source.replace(old_return, new_return, 1)

          start = source.find("function feedbackText(r){")
          end = source.find("\nfunction phraseSplit", start)
          if start < 0 or end < 0:
              raise SystemExit("feedbackText function not found")
          replacement = '''function feedbackText(r){const punctuationOnly=Boolean(r.punctuationEquivalent&&!r.characterExact),fidelity=!r.characterExact&&r.wordScore===100,headline=punctuationOnly?'<div class="tiny fidelity-note"><strong>All words are correct. Punctuation differences are shown below for reference and do not reduce your score.</strong></div>':fidelity?'<div class="tiny fidelity-note"><strong>All words are correct. Check the highlighted capitalization or punctuation difference below.</strong></div>':'',detail=fidelity?characterDiffHtml(r):`<div class="diff">${diffHtml(r)}</div><div class="tiny muted" style="margin-top:6px">Green: correct · red strike: substituted · red box: missing · underlined +word: extra</div>`;return`<div class="feedback ${r.score>=95?'good':r.score>=80?'warn':'bad'}" role="status" aria-live="polite"><div><span class="score-big">${r.score}%</span> <span class="muted">${r.wordScore}% words · ${r.charScore}% characters</span></div>${headline}${detail}</div>`}'''
          source = source[:start] + replacement + source[end:]

          if "punctuationEquivalent=wordScore===100" not in source:
              raise SystemExit("punctuation tolerance was not installed")
          if "Punctuation differences are shown below for reference and do not reduce your score." not in source:
              raise SystemExit("feedback copy was not installed")

          path.write_text(source, encoding="utf-8")
      - name: Commit app update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Make punctuation lenient in recall scoring"
          git push
