name: P2-2 App Bridge Observer Scope
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'ux-patch.js'
      - 'enhancements.js'
      - 'enhancements-core.js'
      - 'language-switch-hardening.js'
      - 'sw.js'
      - 'tests/p2-2-app-bridge-observer-scope.mjs'
      - 'tests/wait-for-pages-deployment.mjs'
      - '.github/workflows/p2-2-app-bridge-observer-scope.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  bridge-scope:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Wait for exact GitHub Pages deployment
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node tests/wait-for-pages-deployment.mjs
      - run: node tests/p2-2-app-bridge-observer-scope.mjs
