name: RC1 Bible Gate
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'app.html'
      - 'translations.js'
      - 'enhancements.js'
      - 'enhancements-legacy.js'
      - 'enhancements-core.js'
      - 'rc3-hardening.js'
      - 'guided-learning-chain.js'
      - 'localization-runtime.js'
      - 'localization-completion.js'
      - 'worker/**'
      - 'tests/rc1-bible-gate.mjs'
      - 'tests/wait-for-pages-deployment.mjs'
      - '.github/workflows/rc1-bible-gate.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Wait for exact GitHub Pages deployment
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node tests/wait-for-pages-deployment.mjs
      - run: node tests/rc1-bible-gate.mjs
