name: P2-4 Resilient Precache
on:
  push:
    branches: [main]
    paths:
      - 'sw.js'
      - 'tests/p2-4-resilient-precache.mjs'
      - 'tests/p2-3-service-worker-strategy.mjs'
      - '.github/workflows/gated-pages-release.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  resilient-precache:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Wait for exact GitHub Pages deployment
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node tests/wait-for-pages-deployment.mjs
      - run: node tests/p2-4-resilient-precache.mjs
