name: RC1 Final Gates
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'app.html'
      - 'translations.js'
      - 'enhancements.js'
      - 'enhancements-legacy.js'
      - 'enhancements-core.js'
      - 'rc3-hardening.js'
      - 'guided-learning-chain.js'
      - 'qol-fast-recall.js'
      - 'qol-cloze-helpers.js'
      - 'qol-word-navigation.js'
      - 'localization-runtime.js'
      - 'localization-completion.js'
      - 'sw.js'
      - 'manifest.webmanifest'
      - 'worker/**'
      - 'tests/rc1-final-gates.mjs'
      - '.github/workflows/rc1-final-gates.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - run: sleep 15
      - run: node tests/rc1-final-gates.mjs
