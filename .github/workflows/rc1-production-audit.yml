name: RC1 Production Audit

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'app.html'
      - 'translations.js'
      - 'enhancements.js'
      - 'enhancements-legacy.js'
      - 'enhancements-core.js'
      - 'language-switch-hardening.js'
      - 'ux-patch.js'
      - 'rc3-hardening.js'
      - 'guided-learning-chain.js'
      - 'qol-fast-recall.js'
      - 'qol-cloze-helpers.js'
      - 'qol-word-navigation.js'
      - 'localization-runtime.js'
      - 'localization-completion.js'
      - 'sw.js'
      - 'manifest.webmanifest'
      - 'worker/**'
      - 'tests/rc1-production-audit-v3.mjs'
      - 'tests/wait-for-pages-deployment.mjs'
      - '.github/workflows/rc1-production-audit.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Wait for exact GitHub Pages deployment
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node tests/wait-for-pages-deployment.mjs

      - name: Run RC1 production audit
        run: node tests/rc1-production-audit-v3.mjs
