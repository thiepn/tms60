name: P2-6 Theme Sync
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'app.html'
      - 'p2-5-shell-runtime.js'
      - 'p2-6-theme-sync.js'
      - 'runtime-translation-switch.js'
      - 'ux-patch.js'
      - 'sw.js'
      - 'tests/p2-6-theme-sync.mjs'
      - 'tests/wait-for-pages-deployment.mjs'
      - '.github/workflows/p2-6-theme-sync.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  theme-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Wait for exact GitHub Pages deployment
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node tests/wait-for-pages-deployment.mjs
      - run: node tests/p2-6-theme-sync.mjs
