name: TMS60 QoL Regression
on:
  push:
    branches: [main]
    paths:
      - 'qol-word-navigation.js'
      - 'qol-fast-recall.js'
      - 'qol-cloze-helpers.js'
      - 'guided-learning-chain.js'
      - 'enhancements.js'
      - 'language-switch-hardening.js'
      - 'sw.js'
      - 'tests/qol-regression-v2.mjs'
      - 'tests/guided-due-regression.mjs'
      - 'tests/p2-1-study-observer-scope.mjs'
      - 'tests/wait-for-pages-deployment.mjs'
      - '.github/workflows/qol-regression.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  qol:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Wait for exact GitHub Pages deployment
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node tests/wait-for-pages-deployment.mjs
      - run: node tests/qol-regression-v2.mjs
      - run: node tests/guided-due-regression.mjs
      - run: node tests/p2-1-study-observer-scope.mjs
